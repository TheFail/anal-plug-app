name: Build on Version Tag

on:
  push:
    tags:
      - 'v*'          # triggers on tags like v1.0.0, v1.2.3, etc.

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        # Note: if gradlew is not yet in the repo, add the Gradle wrapper first

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Optional: also build release if you have signing set up
      # - name: Build release APK
      #   run: ./gradlew assembleRelease
